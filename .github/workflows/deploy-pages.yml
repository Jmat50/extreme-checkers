name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check Render game server URL
        run: |
          if [ -z "${{ vars.GAME_SERVER_URL }}" ]; then
            echo "::warning::Repository variable GAME_SERVER_URL is not set. Online multiplayer will be disabled on GitHub Pages until you deploy Render and set it (see docs/DEPLOYMENT.md)."
          fi

      - name: Build for GitHub Pages
        run: npm run test:gh
        env:
          BASE_PATH: /extreme-checkers/
          VITE_GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}

      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
